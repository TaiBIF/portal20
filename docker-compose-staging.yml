version: '3.7'

services:
  web:
    build: .
    container_name: taibif-web-stag-container
    image: taibif-web-stag-image
    expose:
      - 8001
    depends_on:
      - db
    links:
      - db:db
    volumes:
      - .:/taibif-code
      - ../taibif-volumes/static:/taibif-volumes/static
      - ../taibif-volumes/media:/taibif-volumes/media
      - ../taibif-volumes/bucket:/taibif-bucket
      - ../taibif-volumes/logs/web:/taibif-code/logs
      - ../taibif-volumes/biomap:/biomap
    command: "./scripts/wait-for-it.sh db:5432 -t 30 -- ./scripts/docker-web-entry.sh"
    #command: ./docker-web-entry.sh
    restart: always
    env_file:
      - .env
  db:
    container_name: taibif-db-stag-container
    image: postgres:12-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=taibif
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ../taibif-volumes/pgdata:/var/lib/postgresql/data/pgdata
      - ../taibif-volumes/bucket:/taibif-bucket
  nginx:
    image: nginx:1.17.6-alpine
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/staging:/etc/nginx/staging:ro
      - ./scripts/staging-nginx.sh:/opt/staging-nginx.sh:ro
      - ../taibif-volumes/certbot-staging/conf:/etc/letsencrypt:ro
      - ../taibif-volumes/certbot-staging/www:/var/www/certbot:ro
      - ../taibif-volumes/static:/taibif-volumes/static
      - ../taibif-volumes/media:/taibif-volumes/media
      - ../taibif-volumes/logs/nginx:/var/log/nginx
      - ../taibif-volumes/biomap:/biomap
    entrypoint: ["/bin/sh", "/opt/staging-nginx.sh"]
    links:
      - web:web
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
  
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ../taibif-volumes/certbot-staging/conf:/etc/letsencrypt
      - ../taibif-volumes/certbot-staging/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --non-interactive --webroot -w /var/www/certbot
          sleep 43200 &
          wait $$!
        done

  solr:
    environment:
      - SOLR_JAVA_MEM=-Xms8g -Xms8g
  celery:
    image: taibif-web-stag-image
