version: '3.7'

services:
  web:
    build: .
    container_name: taibif-web-dev-container
    image: taibif-web-dev-image
    ports:
      - 8003:8001
    depends_on:
      - db
    links:
      - db:db
    volumes:
      - .:/taibif-code
      - ../taibif-volumes/bucket:/taibif-volumes/bucket
      - ../taibif-volumes/media:/taibif-volumes/media
      - ../taibif-volumes/biomap:/biomap
    command: "./scripts/wait-for-it.sh db:5432 -t 5 -- ./scripts/docker-web-dev-entry.sh"
    #command: "./scripts/wait-for-it.sh db:5432 -t 5 -- ./scripts/docker-web-entry.sh"
    restart: always
    env_file:
      - .env
  db:
    build: ./postgres
    container_name: taibif-db-container
    image: postgres:12-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=taibif
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ../taibif-volumes/pgdata:/var/lib/postgresql/data/pgdata
      - ../taibif-volumes/bucket:/taibif-volumes/bucket
  redis:
    image: redis:5-alpine
    restart: always
  solr:
    build: ./solr-workspace
    image: solr:8.11.1
    container_name: taibif-solr
    ports:
      - "8983:8983"
    volumes:
      - ../taibif-volumes/solr:/var/solr
      - ./solr-workspace/:/workspace
    command:
      - solr-precreate
      - gettingstarted
    environment:
      - SOLR_JAVA_MEM=-Xms2g -Xms2g
  celery:
    restart: unless-stopped
    container_name: taibif-celery-container
    image: taibif-web-dev-image
    command: sh -c "celery -A conf worker -l info -f /var/log/web-celery/celery.log"
    volumes:
      - .:/taibif-code
      - ../taibif-volumes/media:/ct22-volumes/media
      - ../taibif-volumes/logs/web-celery:/var/log/web-celery
    depends_on:
      - redis
      - web
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
  