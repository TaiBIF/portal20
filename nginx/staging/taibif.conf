limit_req_zone $binary_remote_addr zone=users:10m rate=6r/s;

upstream taibif_instance {
    server web:8001;
}

server {
    listen 80;
    server_name staging.taibif.tw;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://staging.taibif.tw$request_uri;
    }
}

server {
    listen 443 ssl;
    charset utf-8;
    server_name staging.taibif.tw;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/staging.taibif.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.taibif.tw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/staging/locations.conf;
}
