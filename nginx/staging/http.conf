limit_req_zone $binary_remote_addr zone=users:10m rate=6r/s;

upstream taibif_instance {
    server web:8001;
}

# Bootstrap without a certificate: keep the site and ACME verification reachable.
server {
    listen 80;
    charset utf-8;
    server_name staging.taibif.tw;
    client_max_body_size 100M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    include /etc/nginx/staging/locations.conf;
}
