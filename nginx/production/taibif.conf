limit_req_zone $binary_remote_addr zone=users:10m rate=6r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=1r/s;

map $http_user_agent $blocked_bot {
    default 0;
    ~*(DotBot|MJ12bot|AhrefsBot|SEMrushBot|MegaIndex\.ru|MauiBot|SEOkicks|Barkrowler|BLEXBot|PetalBot|DataForSeoBot) 1;
}

upstream taibif_instance {
    server web:8001;
}

server {
    listen 80;
    server_name taibif.tw;
    return 301 $scheme://portal.taibif.tw;
}

server {
    listen 443;
    server_name taibif.tw;
    ssl_certificate /etc/letsencrypt/live/portal.taibif.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.taibif.tw/privkey.pem;
    return 301 $scheme://portal.taibif.tw;
}

server {
    listen 80;
    charset utf-8;
    server_name portal.taibif.tw;
    server_tokens off;
    client_max_body_size  100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    charset utf-8;
    server_name portal.taibif.tw;
    server_tokens off;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/portal.taibif.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.taibif.tw/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($blocked_bot) {
        return 403;
    }

    location = /coordinateConverter.php {
        return 301 https://portal.taibif.tw/zh-hant/coordinate-converter;
    }

    location = /BDTools/coordinateConverter.php {
        return 301 https://portal.taibif.tw/zh-hant/coordinate-converter;
    }

    location /static {
        root /taibif-volumes/;
        expires 7d;
    }

    location /media {
        root /taibif-volumes/;
        expires 7d;
    }

    location /biomap {
        root /;
        allow 140.109.236.125;
        deny all;
    }

    location = /favicon.ico {
        root /taibif-volumes/static/;
        access_log  off;
        log_not_found off;
    }

    location / {
        limit_req zone=users burst=6 nodelay;
        proxy_pass              http://taibif_instance;
        proxy_redirect          off;
        proxy_set_header        Host $http_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $server_name;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   60;
        proxy_read_timeout      60;
    }

}
